version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: file_server_db
    restart: always
    environment:
      POSTGRES_DB: file_server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pgisready -U postgres -d file_server"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: